[server]
host = "0.0.0.0"
port = 8443
worker_threads = 8

[cache]
enabled = true
max_hot_memory_mb = 512
default_ttl_secs = 300

[kubernetes]
# Set enabled = true to watch active Kubernetes Ingress and Gateway API CRDs
enabled = false

# Routes can be configured statically below or dynamically via the Admin API at http://localhost:8443/admin/v1/routes
# Example:
# [[routes]]
# id = "users_service"
# path_prefix = "/api/v1/users"
# upstream_url = "http://127.0.0.1:9090"
# enable_cache = true
# cache_ttl_secs = 60
