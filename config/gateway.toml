[server]
host = "0.0.0.0"
port = 8443
worker_threads = 8

[cache]
enabled = true
htar_bundle_path = "config/cache.htar"
max_hot_memory_mb = 512
default_ttl_secs = 300

[[routes]]
id = "users_service"
path_prefix = "/api/v1/users"
upstream_url = "http://127.0.0.1:9090"
enable_cache = true
cache_ttl_secs = 60

[[routes]]
id = "static_assets"
path_prefix = "/static"
upstream_url = "http://127.0.0.1:9091"
enable_cache = true
cache_ttl_secs = 3600

[[routes]]
id = "auth_service"
path_prefix = "/api/v1/auth"
upstream_url = "http://127.0.0.1:9092"
enable_cache = false
