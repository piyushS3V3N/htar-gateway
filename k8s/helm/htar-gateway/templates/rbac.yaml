{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "htar-gateway.fullname" . }}-role
  labels:
    {{- include "htar-gateway.labels" . | nindent 4 }}
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "htar-gateway.fullname" . }}-binding
  labels:
    {{- include "htar-gateway.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "htar-gateway.fullname" . }}-role
subjects:
  - kind: ServiceAccount
    name: {{ include "htar-gateway.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "htar-gateway.fullname" . }}-admin-binding
  labels:
    {{- include "htar-gateway.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: {{ include "htar-gateway.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
