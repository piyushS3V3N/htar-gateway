apiVersion: v1
kind: Service
metadata:
  name: {{ include "htar-gateway.fullname" . }}-service
  labels:
    {{- include "htar-gateway.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  {{- if .Values.service.externalIPs }}
  externalIPs:
    {{- toYaml .Values.service.externalIPs | nindent 4 }}
  {{- end }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
  selector:
    {{- include "htar-gateway.selectorLabels" . | nindent 4 }}
