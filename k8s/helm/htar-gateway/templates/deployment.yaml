apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "htar-gateway.fullname" . }}
  labels:
    {{- include "htar-gateway.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "htar-gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "htar-gateway.selectorLabels" . | nindent 8 }}
      annotations:
        {{- if .Values.vault.enabled }}
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: {{ .Values.vault.agentInject.role | quote }}
        vault.hashicorp.com/agent-inject-secret-env: {{ .Values.vault.secretPath | quote }}
        vault.hashicorp.com/agent-inject-template-env: |
          {{ `{{- with secret "` }}{{ .Values.vault.secretPath }}{{ `" -}}` }}
          HTAR_ADMIN_PASSWORD="{{ `{{ .Data.data.HTAR_ADMIN_PASSWORD }}` }}"
          HTAR_OPERATOR_PASSWORD="{{ `{{ .Data.data.HTAR_OPERATOR_PASSWORD }}` }}"
          HTAR_VIEWER_PASSWORD="{{ `{{ .Data.data.HTAR_VIEWER_PASSWORD }}` }}"
          MYSQL_PASSWORD="{{ `{{ .Data.data.HTAR_MYSQL_PASSWORD }}` }}"
          {{ `{{- end -}}` }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "htar-gateway.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: VAULT_ADDR
              value: {{ .Values.vault.address | quote }}
            - name: VAULT_SECRET_PATH
              value: {{ .Values.vault.secretPath | quote }}
            - name: MYSQL_HOST
              value: {{ .Values.mysql.host | quote }}
            - name: MYSQL_PORT
              value: {{ .Values.mysql.port | quote }}
            - name: MYSQL_DATABASE
              value: {{ .Values.mysql.database | quote }}
            - name: K8S_DASHBOARD_URL
              value: {{ .Values.k8sDashboard.upstreamUrl | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.config.port }}
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /_htar/health
              port: {{ .Values.config.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /_htar/health
              port: {{ .Values.config.port }}
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
          volumeMounts:
            - name: config-volume
              mountPath: /app/config
            - name: storage-volume
              mountPath: /tmp/htargw-store
      volumes:
        - name: config-volume
          configMap:
            name: {{ include "htar-gateway.fullname" . }}-config
        - name: storage-volume
          hostPath:
            path: /tmp/htar-gateway-persistence
            type: DirectoryOrCreate
