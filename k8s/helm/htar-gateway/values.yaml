replicaCount: 2

image:
  repository: htar-gateway
  pullPolicy: IfNotPresent
  tag: "latest"

serviceAccount:
  create: true
  name: "htar-gateway-sa"

rbac:
  create: true

service:
  type: LoadBalancer
  port: 80
  targetPort: 8443

resources:
  limits:
    cpu: 2000m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

config:
  host: "0.0.0.0"
  port: 8443
  workerThreads: 8
  cacheEnabled: true
  maxHotMemoryMb: 512

# --- Enterprise Identity & Authentication Section ---
# Zero plaintext secrets stored in Helm values!
# Secrets are dynamically injected at runtime via HashiCorp Vault Agent sidecar or Vault REST API.
auth:
  enabled: true

# --- HashiCorp Vault Secrets Management ---
vault:
  enabled: true
  address: "http://vault.dev-tools.svc.cluster.local:8200"
  secretPath: "secret/data/htargw"
  agentInject:
    enabled: true
    role: "htar-gateway"
    secretMountPath: "/vault/secrets"
    secretFileName: "env"

# --- MySQL Cluster Database Settings ---
mysql:
  enabled: true
  host: "mysql.dev-tools.svc.cluster.local"
  port: 3306
  database: "htargw_db"

# --- Kubernetes Dashboard SSO Auth Proxy Integration ---
k8sDashboard:
  enabled: true
  upstreamUrl: "http://kubernetes-dashboard.dev-tools.svc.cluster.local:9090"
  pathPrefix: "/k8s-dashboard"
