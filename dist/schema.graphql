# ==============================================================================
# GRAPHQL-OVER-REST FEDERATION SCHEMA DEFINITION (SDL)
# Max Query Depth = 6 | Parallel Async Tokio Aggregation
# ==============================================================================

directive @rest(
  endpoint: String!
  method: String! = "GET"
  headers: [HeaderInput!]
  timeoutMs: Int = 3000
) on FIELD_DEFINITION

input HeaderInput {
  key: String!
  value: String!
}

type Query {
  getpayments_service_v1(id: ID!): payments_service_v1Payload
    @rest(
      endpoint: "http://payments-backend.internal:8080/api/v1/payments_service_v1/{args.id}"
      method: "GET"
    )

}

type payments_service_v1Payload {
  id: ID!
  status: String!
  data: String!
}

