apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: htar-ingress-gateway
  namespace: htar-system
  annotations:
    htar.gateway/enable: "true"
spec:
  gatewayClassName: htar
  listeners:
  - name: http
    protocol: HTTP
    port: 80
  - name: https
    protocol: HTTPS
    port: 443
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httproute-route-payments-service-v1-id
  namespace: htar-system
  annotations:
    htar.gateway/enable: "true"
    htar.gateway/path: "/api/v1/payments"
spec:
  parentRefs:
  - name: htar-ingress-gateway
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api/v1/payments
    backendRefs:
    - name: payments-service-v1-id
      port: 8080
---
