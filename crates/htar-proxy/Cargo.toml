[package]
name = "htar-proxy"
version = "0.1.0"
edition = "2021"
description = "High performance async HTTP API Gateway proxy engine powered by Hyper & HTAR"

[dependencies]
htar-core = { path = "../htar-core" }
htar-cache = { path = "../htar-cache" }
htar-wasm = { path = "../htar-wasm" }
htar-graphql = { path = "../htar-graphql" }
htar-ebpf = { path = "../htar-ebpf" }
tokio = { workspace = true, features = ["full"] }
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
tower.workspace = true
dashmap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
bytes.workspace = true
thiserror.workspace = true
anyhow.workspace = true
reqwest.workspace = true
jsonwebtoken = "9.3"
uuid = { version = "1.8", features = ["v4", "serde"] }
regex = "1.10"
sha2 = "0.10"
hex = "0.4"
ring = "0.17"
base64 = "0.22"

kube = { version = "0.90", features = ["runtime", "client"] }
k8s-openapi = { version = "0.21", features = ["v1_28"] }
futures = "0.3"

[dev-dependencies]
tempfile = "3.10"
